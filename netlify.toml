[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json exige Node >= 22.12.0
  NODE_VERSION = "22"

# Les variables secrètes (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, ADMIN_SECRET, ADMIN_PASSWORD)
# se définissent dans l'interface Netlify, jamais dans ce fichier.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
